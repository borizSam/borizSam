name: profile

on:
  schedule:
    - cron: "17 5 * * *" # cada día, 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerar stats.svg y últimos pushes
        run: python3 scripts/update_profile.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg README.md
          git diff --cached --quiet || git commit -m "chore(profile): actualizar stats"
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#00ff41&color_dots=#0a0a0a,#003b0f,#00661a,#00a82b,#00ff41

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
