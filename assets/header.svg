<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,'Courier New',monospace" font-size="16">
  <title>boris@fsociety</title>
  <defs>
    <clipPath id="c1"><rect x="28" y="64" width="0" height="22"><animate attributeName="width" from="0" to="77.6" dur="0.8s" begin="0.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="28" y="112" width="0" height="22"><animate attributeName="width" from="0" to="164.9" dur="1.1s" begin="1.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="28" y="160" width="0" height="22"><animate attributeName="width" from="0" to="300.7" dur="1.6s" begin="3.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="28" y="208" width="0" height="22"><animate attributeName="width" from="0" to="223.1" dur="1.2s" begin="5.9s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="898" height="298" rx="10" fill="#000000" stroke="#00ff41" stroke-opacity="0.35"/>
  <path d="M1 11a10 10 0 0 1 10-10h878a10 10 0 0 1 10 10v26H1z" fill="#0a0a0a"/>
  <line x1="1" y1="37" x2="899" y2="37" stroke="#00ff41" stroke-opacity="0.2"/>
  <circle cx="24" cy="19" r="6" fill="#222"/>
  <circle cx="46" cy="19" r="6" fill="#222"/>
  <circle cx="68" cy="19" r="6" fill="#00ff41" fill-opacity="0.8"/>
  <text x="450" y="24" text-anchor="middle" font-size="13" fill="#8b949e">boris@fsociety: ~</text>

  <!-- 1 -->
  <g clip-path="url(#c1)">
    <text x="28" y="80"><tspan fill="#00ff41">$ </tspan><tspan fill="#c9d1d9">whoami</tspan></text>
  </g>
  <text x="28" y="104" fill="#8b949e" opacity="0">boris — cloud &amp; devops engineer · barcelona
    <set attributeName="opacity" to="1" begin="1.3s" fill="freeze"/>
  </text>

  <!-- 2 -->
  <g clip-path="url(#c2)">
    <text x="28" y="128"><tspan fill="#00ff41">$ </tspan><tspan fill="#c9d1d9">cat mission.txt</tspan></text>
  </g>
  <text x="28" y="152" fill="#8b949e" opacity="0">automatizar lo repetitivo. escalar lo esencial.
    <set attributeName="opacity" to="1" begin="3.1s" fill="freeze"/>
  </text>

  <!-- 3 -->
  <g clip-path="url(#c3)">
    <text x="28" y="176"><tspan fill="#00ff41">$ </tspan><tspan fill="#c9d1d9">terraform apply -auto-approve</tspan></text>
  </g>
  <text x="28" y="200" fill="#00ff41" opacity="0">Apply complete! 0 trabajo manual.
    <set attributeName="opacity" to="1" begin="5.3s" fill="freeze"/>
  </text>

  <!-- 4 -->
  <g clip-path="url(#c4)">
    <text x="28" y="224"><tspan fill="#00ff41">$ </tspan><tspan fill="#c9d1d9">echo "hello, friend."</tspan></text>
  </g>
  <text x="28" y="248" fill="#c9d1d9" opacity="0">hello, friend.
    <set attributeName="opacity" to="1" begin="7.2s" fill="freeze"/>
  </text>

  <!-- prompt + cursor -->
  <text x="28" y="272" fill="#00ff41" opacity="0">$
    <set attributeName="opacity" to="1" begin="7.4s" fill="freeze"/>
  </text>
  <rect x="47.4" y="258" width="9" height="17" fill="#00ff41" opacity="0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" begin="7.4s" repeatCount="indefinite"/>
  </rect>
</svg>
