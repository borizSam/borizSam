  <text x="450" y="24" text-anchor="middle" font-size="13" fill="#6e7681">boris@fsociety: ~</text>

  <text x="28" y="70"><tspan fill="#00ff41">$ </tspan><tspan fill="#c9d1d9">cat hola.txt</tspan></text>
  <text x="28" y="94" fill="#c9d1d9">Hola, soy <tspan fill="#00ff41" font-weight="bold">Boris</tspan>.</text>
  <text x="28" y="118" fill="#c9d1d9">Cloud &amp; DevOps engineer en Barcelona.</text>
  <text x="28" y="166" fill="#8b949e">Me dedico a que lo repetitivo se haga solo:</text>
  <text x="28" y="190" fill="#8b949e">pipelines, contenedores, infra como código y nube.</text>
  <text x="28" y="214" fill="#8b949e">Si hay que tocarlo a mano dos veces, lo automatizo la tercera.</text>

  <text x="28" y="262"><tspan fill="#00ff41">$ </tspan><tspan fill="#c9d1d9">cat now.yml</tspan></text>
  <text x="28" y="286"><tspan fill="#00ff41">trabajando:</tspan><tspan fill="#c9d1d9">  DevOps @ OCA GLOBAL</tspan><tspan fill="#6e7681">   # Ansible · Jenkins · Zabbix · Azure</tspan></text>
  <text x="28" y="310"><tspan fill="#00ff41">estudiando:</tspan><tspan fill="#c9d1d9">  Ing. Informática @ UOC</tspan></text>
  <text x="28" y="334"><tspan fill="#00ff41">preparando:</tspan><tspan fill="#c9d1d9">  AWS Solutions Architect Associate</tspan></text>
  <text x="28" y="358"><tspan fill="#00ff41">rompiendo:</tspan><tspan fill="#c9d1d9">   Terraform, Kubernetes y mi homelab de vez en cuando</tspan></text>

